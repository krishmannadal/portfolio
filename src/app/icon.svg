<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="#08090d" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Ambient Glow -->
  <circle cx="16" cy="16" r="12" fill="url(#lensGlow)" />

  <!-- Concentric Telemetry Rings -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="0.75" stroke-dasharray="2 1.5" />
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1" />

  <!-- Central Core Aperture -->
  <circle cx="16" cy="16" r="3" fill="url(#lensGrad)" />
  <circle cx="16" cy="16" r="1" fill="#ffffff" />

  <!-- Precision Crosshair Ticks -->
  <line x1="16" y1="3.5" x2="16" y2="5.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
  <line x1="16" y1="26.5" x2="16" y2="28.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
  <line x1="3.5" y1="16" x2="5.5" y2="16" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
  <line x1="26.5" y1="16" x2="28.5" y2="16" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
</svg>
